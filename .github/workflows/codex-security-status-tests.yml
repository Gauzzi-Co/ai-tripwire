name: Codex Security status tests
# Numeric DATA only; the trusted publisher resolves and validates it via GitHub.
run-name: ${{ github.event.pull_request.number || inputs.pr_number }}

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request whose security status should be refreshed
        required: true
        type: string

# PR-controlled code gets no write token, secrets, artifacts, or caches.
permissions:
  contents: read

jobs:
  status-tests:
    name: Test security status publisher
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - run: node --test .github/scripts/codex-security-status.test.cjs
      - name: Validate workflow YAML
        run: ruby -rpsych -e 'ARGV.each { |p| Psych.safe_load(File.read(p), aliases:false) }' .github/workflows/codex-security-status.yml .github/workflows/codex-security-status-tests.yml

  request-refresh:
    name: Request trusted status refresh
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name != 'pull_request' &&
       github.actor_id == '199175422' &&
       github.actor == 'chatgpt-codex-connector[bot]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # The workflow_run event is just a wake-up. No result or artifact from
      # this PR-revision job is trusted or executed by the privileged writer.
      - run: 'true'
